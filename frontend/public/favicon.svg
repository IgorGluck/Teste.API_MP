<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#050a24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a3a8a" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#0088ff" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .circuit-line {
        fill: none;
        stroke: url(#glowGradient);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .circuit-dot {
        fill: url(#glowGradient);
      }
    </style>
  </defs>

  <g filter="url(#outerGlow)">
    <path d="M128,24 L220,76 V180 L128,232 L36,180 V76 Z" fill="url(#bgGradient)" stroke="url(#glowGradient)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <g transform="translate(128 128) scale(0.9) translate(-128 -128)">
    <path class="circuit-line" d="M160,70 L180,85 L180,115 L140,145 L100,115 L100,85 L120,70" opacity="0.6"/>
    <path class="circuit-line" d="M170,60 L200,80 L200,125 L140,165 L80,125 L80,80 L110,60" />
    
    <path class="circuit-line" d="M100,170 L80,155 L80,135 M180,135 L180,155 L160,170" opacity="0.6"/>
    <path class="circuit-line" d="M110,180 L60,150 L60,115 M220,115 L220,150 L170,180"/>

    <circle class="circuit-dot" cx="60" cy="115" r="5"/>
    <circle class="circuit-dot" cx="220" cy="115" r="5"/>
    <circle class="circuit-dot" cx="110" cy="60" r="5"/>
    
    <g transform="translate(128 128)">
        <line class="circuit-line" x1="0" y1="-20" x2="0" y2="20" stroke-width="4"/>
        <path class="circuit-line" d="M-10, -10 L0, -25 L10, -10" stroke-width="4" fill="none"/>
        
        <line class="circuit-line" x1="-15" y1="5" x2="0" y2="5" stroke-width="3"/>
        <circle class="circuit-dot" cx="-15" cy="5" r="4"/>
        
        <line class="circuit-line" x1="15" y1="-5" x2="0" y2="-5" stroke-width="3"/>
        <circle class="circuit-dot" cx="15" cy="-5" r="4"/>
    </g>
  </g>
</svg>